# Run from project root: docker compose -f docker/docker-compose.local.yml --env-file .env up -d
# Or from docker/ dir:   docker compose -f docker-compose.local.yml --env-file ../.env up -d
# LOCAL MODE: ephemeral by design (no Kafka volume). Data is lost on container
# stop — use pseudo or distributed mode for persistence.

name: energy-local

services:

  # ── Kafka ──────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-local
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - energy-net

  # ── Kafka Init ─────────────────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init-local
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    # Explicit retention + cleanup + compression on every topic. Defaults are
    # 7-day delete with no compression; making this explicit documents intent
    # and prevents per-broker drift. Snappy compression cuts disk usage ~3x
    # on JSON payloads with negligible CPU cost.
    entrypoint: ["/bin/bash", "-c",
      "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic smart-meters --partitions 3 --replication-factor 1 --config retention.ms=604800000 --config cleanup.policy=delete --config compression.type=snappy &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic weather --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete --config compression.type=snappy &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic incident-reports --partitions 1 --replication-factor 1 --config retention.ms=7776000000 --config cleanup.policy=delete --config compression.type=snappy &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic rss-feeds --partitions 1 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete --config compression.type=snappy &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic market-prices --partitions 1 --replication-factor 1 --config retention.ms=7776000000 --config cleanup.policy=delete --config compression.type=snappy &&
       kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic user-feedback --partitions 3 --replication-factor 1 --config retention.ms=2592000000 --config cleanup.policy=delete --config compression.type=snappy &&
       echo 'All 6 topics created with explicit retention + snappy compression.'"]
    networks:
      - energy-net

  # ── Schema Registry ────────────────────────────────────────────────────────
  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry-local
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8081}:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - energy-net

  # ── Kafka UI (Provectus) ───────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui-local
    restart: on-failure
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: energy-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    networks:
      - energy-net

  # ── MongoDB ────────────────────────────────────────────────────────────────
  # init script in storage/init/ runs ONCE on first startup (when /data/db is
  # empty). Re-run by destroying the volume: docker compose down -v
  mongodb:
    image: mongo:7.0
    container_name: mongodb-local
    restart: on-failure
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    volumes:
      - ../storage/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - energy-net

  # ── Spark ──────────────────────────────────────────────────────────────────
  # Project root mounted at /workspace so any teammate on any OS can run:
  #   docker exec spark-master-local /opt/spark/bin/spark-submit \
  #     --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.0,org.mongodb.spark:mongo-spark-connector_2.12:10.3.0 \
  #     /workspace/processing/main.py
  # Ivy cache volumed so the ~100 MB of JARs only downloads once per machine.
  spark-master:
    build:
      context: ..
      dockerfile: docker/Dockerfile.spark
    image: energy/spark:3.5.0    # local tag — shared with spark-worker below
    container_name: spark-master-local
    restart: on-failure
    user: root
    command: ["/opt/spark/sbin/start-master.sh"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      # When Spark runs INSIDE the container, the Kafka and Mongo hostnames
      # are the Docker service names, NOT localhost. These override the
      # defaults baked into processing/spark_session.py.
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MONGO_HOST: mongodb
      MONGO_PORT: "27017"
      MONGO_DB_NAME: ${MONGO_DB_NAME:-energy_db}
      MONGO_SPARK_USER: ${MONGO_USERNAME:-energy_admin}
      MONGO_SPARK_PASS: ${MONGO_PASSWORD:-change-me-before-deploy}
      NUM_METERS: ${NUM_METERS:-10}
      SPARK_CHECKPOINT_DIR: /tmp/spark-checkpoints
      # Make /workspace importable as the top-level package root so
      # `from processing.spark_session import ...` resolves correctly.
      PYTHONPATH: /workspace
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ..:/workspace:rw                          # project source visible inside container
      - spark-ivy-cache:/root/.ivy2               # cache --packages downloads across runs
      - spark-checkpoints:/tmp/spark-checkpoints  # persist Spark streaming state
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - energy-net

  spark-worker:
    image: energy/spark:3.5.0     # built by spark-master service above
    container_name: spark-worker-local
    restart: on-failure
    user: root
    command: ["/opt/spark/sbin/start-worker.sh", "spark://spark-master:7077"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY:-2g}
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES:-2}
    volumes:
      - ..:/workspace:rw                          # worker needs the code too
      - spark-ivy-cache:/root/.ivy2               # share Ivy cache with master
      - spark-checkpoints:/tmp/spark-checkpoints
    depends_on:
      spark-master:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - energy-net

networks:
  energy-net:
    driver: bridge

volumes:
  spark-ivy-cache:
  spark-checkpoints: